name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Syntax + unit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --omit=dev
      - run: npm test

  live:
    name: Live health (after deploy)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: App responds and health endpoint is up
        run: |
          curl -sf -o /dev/null https://crm.onpointprodoors.com/
          curl -sf https://crm.onpointprodoors.com/healthz | grep -q '"ok":true'
      - name: Repo root is not served
        run: |
          for p in server.js .git/HEAD .secrets/anthropic.key package.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://crm.onpointprodoors.com/$p")
            echo "$p -> $code"; [ "$code" = "404" ] || exit 1
          done
